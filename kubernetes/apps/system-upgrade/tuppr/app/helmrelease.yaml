---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: 2
    silences:
      enabled: true
      alertmanager:
        address: http://vmalertmanager-victoria-metrics.observability.svc:9093
    controller:
      leaderElection:
        enabled: true
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: tuppr
                app.kubernetes.io/instance: tuppr
    monitoring:
      dashboards:
        enabled: false # Customized dashboard is provisioned by grafana-dashboards.
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
