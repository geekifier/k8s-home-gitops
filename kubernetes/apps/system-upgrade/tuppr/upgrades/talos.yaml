---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.13.10
  parallelism: 1
  silences:
    - matchers:
        - name: alertname
          value: ServiceDown
          matchType: "="
        - name: namespace
          value: observability
          matchType: "="
        - name: job
          value: vmsingle-external-reloader-http
          matchType: "="
      maxDuration: 2h
    - matchers:
        - name: alertname
          value: etcdHighNumberOfFailedGRPCRequests
          matchType: "="
        - name: namespace
          value: kube-system
          matchType: "="
        - name: job
          value: kube-etcd
          matchType: "="
        - name: grpc_service
          value: etcdserverpb.Lease
          matchType: "="
        - name: grpc_method
          value: LeaseKeepAlive
          matchType: "="
      maxDuration: 2h
    # The histogram also sees intentionally short-lived maintenance clients.
    # Limit renewal because the metric cannot distinguish client identities.
    - matchers:
        - name: alertname
          value: KubeClientCertificateExpiration
          matchType: "="
        - name: job
          value: apiserver
          matchType: "="
      maxDuration: 30m
  policy:
    force: false
    nodrain: false
    placement: hard
    stage: false
    timeout: 60m
    # Talos owns cordon, eviction and uncordon inside the upgrade Job.
    # Longhorn PDBs gate engine shutdown; no additional CSI wait is required.
    waitForVolumeDetach: false
  # No pre-hooks: 0.5.5 skips inter-batch health checks when they are configured.
  # Admission checks BEFORE the next node; PostgreSQL 2/3 is expected while
  # the active Job drains/reboots its node. Talos uncordons on return.
  # Shared health checks are injected by kustomization.yaml.
