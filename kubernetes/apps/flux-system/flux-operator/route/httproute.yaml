---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/gateway.networking.k8s.io/httproute_v1.json
# Flux UI; the chart's route can't set labels.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-operator
  labels:
    auth.xenu.internal/method: sso
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "flux.${SECRET_DOMAIN_INT}"
  rules:
    - backendRefs:
        - name: flux-operator
          port: 9080
