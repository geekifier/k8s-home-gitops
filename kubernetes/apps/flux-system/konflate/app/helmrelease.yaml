---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: konflate
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.6.4
  url: oci://ghcr.io/home-operations/charts/konflate
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: konflate
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      repo: github://geekifier/xenu-ng
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.${SECRET_DOMAIN_INT}
      kubeVersion: "{{ .Capabilities.KubeVersion.Version }}"
      verifyImages: true
      # Read-only MCP endpoint at /mcp; the konflate-mcp route checks ServiceAccount tokens.
      mcp: true
      # Copy-to-merge command shown in the UI (konflate never runs it); rebase-only repo.
      mergeCommand: "gh pr merge {{.Number}} -r --repo {{.Repo}}"
    secret:
      existingSecret: konflate-secret
    httpRoute:
      enabled: true
      labels:
        auth.xenu.internal/method: sso
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
      hostnames:
        - konflate.${SECRET_DOMAIN_INT}
    persistence:
      enabled: true
      storageClass: longhorn-standard
      accessModes:
        - ReadWriteOnce
      size: 5Gi
    monitoring:
      serviceMonitor:
        enabled: true
