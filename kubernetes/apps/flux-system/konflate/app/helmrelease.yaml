---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: konflate
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.6.2
  url: oci://ghcr.io/home-operations/charts/konflate
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: konflate
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      repo: github://geekifier/xenu-ng
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.${SECRET_DOMAIN_INT}
      kubeVersion: "{{ .Capabilities.KubeVersion.Version }}"
      verifyImages: true
      # Read-only MCP endpoint at /mcp; only reachable via the internal ingress
      # (the external ingress exposes /hooks alone).
      mcp: true
      # Copy-to-merge command shown in the UI (konflate never runs it); rebase-only repo.
      mergeCommand: "gh pr merge {{.Number}} -r --repo {{.Repo}}"
    secret:
      existingSecret: konflate-secret
    ingress:
      enabled: true
      className: internal
      annotations:
        nginx.ingress.kubernetes.io/auth-method: "GET"
        nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local:9091/api/authz/auth-request"
        nginx.ingress.kubernetes.io/auth-signin: "https://auth-k8s.${SECRET_DOMAIN_INT}?rm=$request_method"
        nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Name,Remote-Groups,Remote-Email"
      hosts:
        - host: konflate.${SECRET_DOMAIN_INT}
          paths:
            - path: /
              pathType: Prefix
    persistence:
      enabled: true
      storageClass: longhorn-yolo
      size: 5Gi
    monitoring:
      serviceMonitor:
        enabled: true
