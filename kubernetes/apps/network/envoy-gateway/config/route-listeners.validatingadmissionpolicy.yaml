# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/validatingadmissionpolicy-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: route-listeners
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes", "grpcroutes"]
  variables:
    - name: gatewayRefs
      expression: >-
        object.spec.?parentRefs.orValue([]).filter(p, p.?kind.orValue('Gateway') == 'Gateway')
    - name: redirectOnly
      expression: >-
        object.spec.?rules.orValue([]).all(r, size(r.?backendRefs.orValue([])) == 0
        && r.?filters.orValue([]).all(f, f.type == 'RequestRedirect'))
  validations:
    - expression: >-
        variables.gatewayRefs.all(p, p.?sectionName.orValue('') in ['https', 'authz']
        || (p.?sectionName.orValue('') == 'http' && variables.redirectOnly))
      message: >-
        Routes attach to a Gateway with sectionName https or authz; http takes only redirect
        routes.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/validatingadmissionpolicybinding-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: route-listeners
spec:
  policyName: route-listeners
  validationActions: ["Deny"]
