---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/grafana.integreatly.org/grafanamanifest_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: envoy-routes
spec:
  # The Grafana CR lives in observability
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  template:
    apiVersion: dashboard.grafana.app/v2
    kind: Dashboard
    metadata:
      name: envoy-routes
      annotations:
        # network
        grafana.app/folder: eenvbrknl23nkc
    spec:
      title: Envoy / Routes
      description: Per-app traffic, latency, errors and availability through Envoy Gateway.
      tags:
        - envoy
        - gateway
      editable: true
      cursorSync: Crosshair
      liveNow: false
      preload: false
      links:
        - title: Envoy
          type: dashboards
          icon: external link
          tooltip: ""
          tags:
            - envoy-mixin
          asDropdown: true
          targetBlank: false
          includeVars: false
          keepTime: true
      annotations:
        - kind: AnnotationQuery
          spec:
            builtIn: true
            enable: true
            hide: true
            iconColor: rgba(0, 211, 255, 1)
            name: Annotations & Alerts
            legacyOptions:
              type: dashboard
            query:
              kind: DataQuery
              group: grafana
              version: v0
              datasource:
                name: -- Grafana --
              spec:
                limit: 100
                matchAny: false
                tags: []
                type: dashboard
      timeSettings:
        timezone: ""
        from: now-6h
        to: now
        autoRefresh: ""
        autoRefreshIntervals:
          - 30s
          - 1m
          - 5m
          - 15m
          - 30m
          - 1h
        hideTimepicker: false
        fiscalYearStartMonth: 0
      variables:
        - kind: DatasourceVariable
          spec:
            name: datasource
            label: Metrics
            pluginId: prometheus
            refresh: onDashboardLoad
            regex: ""
            current:
              text: VictoriaMetrics
              value: victoriametrics-prom
            options: []
            multi: false
            includeAll: false
            hide: inControlsMenu
            skipUrlSync: false
            allowCustomValue: true
        - kind: DatasourceVariable
          spec:
            name: loki
            label: Logs
            pluginId: loki
            refresh: onDashboardLoad
            regex: ""
            current:
              text: Grafana Cloud Loki
              value: P72F4ACBC2B8EE050
            options: []
            multi: false
            includeAll: false
            hide: inControlsMenu
            skipUrlSync: false
            allowCustomValue: true
        - kind: QueryVariable
          spec:
            name: gateway
            label: Gateway
            hide: dontHide
            refresh: onTimeRangeChanged
            skipUrlSync: false
            query:
              kind: DataQuery
              group: prometheus
              version: v0
              datasource:
                name: ${datasource}
              spec:
                qryType: 1
                label: pod
                metric: envoy_server_live
                labelFilters:
                  - label: namespace
                    op: "="
                    value: network
                query: label_values(envoy_server_live{namespace="network"},pod)
                refId: PrometheusVariableQueryEditor-VariableQuery
            definition: label_values(envoy_server_live{namespace="network"},pod)
            regex: /^(.+)-[a-z0-9]+-[a-z0-9]+$/
            sort: alphabeticalAsc
            options: []
            current:
              text:
                - All
              value:
                - $__all
            multi: true
            includeAll: true
            allValue: .+
            allowCustomValue: true
        - kind: QueryVariable
          spec:
            name: route
            label: Route
            hide: dontHide
            refresh: onTimeRangeChanged
            skipUrlSync: false
            query:
              kind: DataQuery
              group: prometheus
              version: v0
              datasource:
                name: ${datasource}
              spec:
                qryType: 1
                label: envoy_cluster_name
                metric: envoy_cluster_upstream_rq_total
                labelFilters:
                  - label: namespace
                    op: "="
                    value: network
                  - label: pod
                    op: =~
                    value: $gateway-.+
                  - label: envoy_cluster_name
                    op: =~
                    value: httproute/.+
                query: label_values(envoy_cluster_upstream_rq_total{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/.+"},envoy_cluster_name)
                refId: PrometheusVariableQueryEditor-VariableQuery
            definition: label_values(envoy_cluster_upstream_rq_total{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/.+"},envoy_cluster_name)
            regex: /^httproute\/([^\/]+\/[^\/]+)\/rule\/[0-9]+$/
            sort: alphabeticalAsc
            options: []
            current:
              text:
                - All
              value:
                - $__all
            multi: true
            includeAll: true
            allValue: .+
            allowCustomValue: true
        - kind: CustomVariable
          spec:
            name: log
            label: Log
            description: Which requests the access log shows.
            query: "Problems : authz|upstream|5xx|4xx|aborted,Auth denials : authz,Upstream failures : upstream,Server errors : 5xx|upstream,Client errors : 4xx,All requests : .*"
            current:
              text: Problems
              value: authz|upstream|5xx|4xx|aborted
            options:
              - text: Problems
                value: authz|upstream|5xx|4xx|aborted
                selected: true
              - text: Auth denials
                value: authz
                selected: false
              - text: Upstream failures
                value: upstream
                selected: false
              - text: Server errors
                value: 5xx|upstream
                selected: false
              - text: Client errors
                value: 4xx
                selected: false
              - text: All requests
                value: .*
                selected: false
            multi: false
            includeAll: false
            hide: dontHide
            skipUrlSync: false
            allowCustomValue: false
      elements:
        s-requests:
          kind: Panel
          spec:
            id: 1
            title: Requests
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      refId: A
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: sum(increase(envoy_cluster_upstream_rq_total{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__interval]))
                          legendFormat: __auto
                          range: true
                          instant: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 13.2.2
              spec:
                options:
                  reduceOptions:
                    calcs:
                      - sum
                    fields: ""
                    values: false
                  orientation: auto
                  textMode: auto
                  colorMode: none
                  graphMode: area
                  justifyMode: auto
                  wideLayout: true
                  showPercentChange: false
                fieldConfig:
                  defaults:
                    unit: short
                    thresholds:
                      mode: absolute
                      steps:
                        - color: blue
                          value: null
                    color:
                      mode: thresholds
                    links:
                      - title: Requests by route
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-10
                      - title: Responses by status class
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-11
                  overrides: []
            description: Total in the time range.
        s-success:
          kind: Panel
          spec:
            id: 2
            title: Success rate
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      refId: A
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: sum(rate(envoy_cluster_upstream_rq_xx{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+", envoy_response_code_class!="5"}[$__rate_interval])) / sum(rate(envoy_cluster_upstream_rq_xx{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__rate_interval]))
                          legendFormat: __auto
                          range: true
                          instant: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 13.2.2
              spec:
                options:
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  orientation: auto
                  textMode: auto
                  colorMode: value
                  graphMode: area
                  justifyMode: auto
                  wideLayout: true
                  showPercentChange: false
                fieldConfig:
                  defaults:
                    unit: percentunit
                    thresholds:
                      mode: absolute
                      steps:
                        - color: red
                          value: null
                        - color: orange
                          value: 0.95
                        - color: green
                          value: 0.99
                    color:
                      mode: thresholds
                    links:
                      - title: Routes with failed requests
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-21
                      - title: Server errors in the access log
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&var-log=5xx%7Cupstream&viewPanel=panel-23
                    decimals: 1
                  overrides: []
            description: Responses that were not 5xx.
        s-p95:
          kind: Panel
          spec:
            id: 3
            title: p95 latency
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      refId: A
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: histogram_quantile(0.95, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__rate_interval])))
                          legendFormat: __auto
                          range: true
                          instant: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 13.2.2
              spec:
                options:
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  orientation: auto
                  textMode: auto
                  colorMode: value
                  graphMode: area
                  justifyMode: auto
                  wideLayout: true
                  showPercentChange: false
                fieldConfig:
                  defaults:
                    unit: ms
                    thresholds:
                      mode: absolute
                      steps:
                        - color: green
                          value: null
                        - color: yellow
                          value: 250
                        - color: red
                          value: 1000
                    color:
                      mode: thresholds
                    links:
                      - title: Slowest routes
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-15
                      - title: Latency distribution
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-16
                  overrides: []
            description: Time to the app's full response.
        s-apdex:
          kind: Panel
          spec:
            id: 4
            title: Apdex
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      refId: A
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: (sum(rate(envoy_cluster_upstream_rq_time_bucket{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+", le="250"}[$__rate_interval])) + sum(rate(envoy_cluster_upstream_rq_time_bucket{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+", le="1000"}[$__rate_interval]))) / 2 / sum(rate(envoy_cluster_upstream_rq_time_count{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__rate_interval]))
                          legendFormat: __auto
                          range: true
                          instant: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 13.2.2
              spec:
                options:
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  orientation: auto
                  textMode: auto
                  colorMode: value
                  graphMode: area
                  justifyMode: auto
                  wideLayout: true
                  showPercentChange: false
                fieldConfig:
                  defaults:
                    unit: none
                    thresholds:
                      mode: absolute
                      steps:
                        - color: red
                          value: null
                        - color: yellow
                          value: 0.85
                        - color: green
                          value: 0.94
                    color:
                      mode: thresholds
                    links:
                      - title: Slowest routes
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-15
                      - title: Latency distribution
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-16
                    decimals: 2
                    min: 0
                    max: 1
                  overrides: []
            description: "T = 250 ms: satisfied ≤ 250 ms, tolerating ≤ 1 s."
        s-5xx:
          kind: Panel
          spec:
            id: 5
            title: 5xx responses
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      refId: A
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: sum(increase(envoy_cluster_upstream_rq_xx{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+", envoy_response_code_class="5"}[$__range]))
                          legendFormat: __auto
                          range: false
                          instant: true
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 13.2.2
              spec:
                options:
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  orientation: auto
                  textMode: auto
                  colorMode: value
                  graphMode: none
                  justifyMode: auto
                  wideLayout: true
                  showPercentChange: false
                fieldConfig:
                  defaults:
                    unit: short
                    thresholds:
                      mode: absolute
                      steps:
                        - color: green
                          value: null
                        - color: red
                          value: 1
                    color:
                      mode: thresholds
                    links:
                      - title: Server errors in the access log
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&var-log=5xx%7Cupstream&viewPanel=panel-23
                      - title: 5xx by route
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-17
                      - title: Routes with failed requests
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-21
                    decimals: 0
                  overrides: []
            description: Total in the time range.
        s-authz:
          kind: Panel
          spec:
            id: 6
            title: Auth denials
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      refId: A
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: sum(increase(envoy_cluster_ext_authz_denied{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__range]))
                          legendFormat: __auto
                          range: false
                          instant: true
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 13.2.2
              spec:
                options:
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  orientation: auto
                  textMode: auto
                  colorMode: none
                  graphMode: none
                  justifyMode: auto
                  wideLayout: true
                  showPercentChange: false
                fieldConfig:
                  defaults:
                    unit: short
                    thresholds:
                      mode: absolute
                      steps:
                        - color: blue
                          value: null
                    color:
                      mode: thresholds
                    links:
                      - title: Auth denials in the access log
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&var-log=authz&viewPanel=panel-23
                      - title: Auth denials by route
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-19
                    decimals: 0
                  overrides: []
            description: Requests Authelia rejected or redirected to login; total in the time range.
        s-failures:
          kind: Panel
          spec:
            id: 7
            title: Backend errors
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      refId: A
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: sum(increase(envoy_cluster_upstream_cx_connect_fail{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__range])) + sum(increase(envoy_cluster_upstream_cx_none_healthy{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__range])) + sum(increase(envoy_cluster_upstream_rq_timeout{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__range]))
                          legendFormat: __auto
                          range: false
                          instant: true
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 13.2.2
              spec:
                options:
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  orientation: auto
                  textMode: auto
                  colorMode: value
                  graphMode: none
                  justifyMode: auto
                  wideLayout: true
                  showPercentChange: false
                fieldConfig:
                  defaults:
                    unit: short
                    thresholds:
                      mode: absolute
                      steps:
                        - color: green
                          value: null
                        - color: red
                          value: 1
                    color:
                      mode: thresholds
                    links:
                      - title: Upstream failures in the access log
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&var-log=upstream&viewPanel=panel-23
                      - title: Upstream failures by route
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-20
                    decimals: 0
                  overrides: []
            description: Refused connections, requests with no ready backend, and timeouts; total in the time range.
        s-throughput:
          kind: Panel
          spec:
            id: 8
            title: Throughput
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      refId: A
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: sum(rate(envoy_cluster_upstream_cx_rx_bytes_total{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__rate_interval])) + sum(rate(envoy_cluster_upstream_cx_tx_bytes_total{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__rate_interval]))
                          legendFormat: __auto
                          range: true
                          instant: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: stat
              version: 13.2.2
              spec:
                options:
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  orientation: auto
                  textMode: auto
                  colorMode: none
                  graphMode: area
                  justifyMode: auto
                  wideLayout: true
                  showPercentChange: false
                fieldConfig:
                  defaults:
                    unit: Bps
                    thresholds:
                      mode: absolute
                      steps:
                        - color: blue
                          value: null
                    color:
                      mode: thresholds
                    links:
                      - title: Throughput by route
                        url: /d/envoy-routes/envoy-routes?${__url_time_range}&${datasource:queryparam}&${loki:queryparam}&${gateway:queryparam}&${route:queryparam}&${log:queryparam}&viewPanel=panel-12
                  overrides: []
            description: Bytes to and from the apps.
        routes-table:
          kind: Panel
          spec:
            id: 9
            title: Routes
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      refId: A
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: round(sum by (route) (label_replace(increase(envoy_cluster_upstream_rq_total{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__range]), "route", "$1", "envoy_cluster_name", "httproute/([^/]+/[^/]+)/rule/.+")))
                          legendFormat: __auto
                          range: false
                          instant: true
                          format: table
                  - kind: PanelQuery
                    spec:
                      refId: B
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
                          expr: sum by (route) (label_replace(rate(envoy_cluster_upstream_rq_xx{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+", envoy_response_code_class!="5"}[$__range]), "route", "$1", "envoy_cluster_name", "httproute/([^/]+/[^/]+)/rule/.+")) / sum by (route) (label_replace(rate(envoy_cluster_upstream_rq_xx{namespace="network", pod=~"$gateway-.+", envoy_cluster_name=~"httproute/$route/rule/.+"}[$__range]), "route", "$1", "envoy_cluster_name", "httproute/([^/]+/[^/]+)/rule/.+"))
                          legendFormat: __auto
                          range: false
                          instant: true
                          format: table
                  - kind: PanelQuery
                    spec:
                      refId: C
                      hidden: false
                      query:
                        kind: DataQuery
                        group: prometheus
                        version: v0
                        datasource:
                          name: ${datasource}
                        spec:
                          editorMode: code
