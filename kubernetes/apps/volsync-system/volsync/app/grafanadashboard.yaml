---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: volsync
spec:
  # The Grafana CR lives in observability
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: storage
  # grafana.com dashboard 21356
  url: https://grafana.com/api/dashboards/21356/revisions/latest/download
  # Refetch the latest revision daily
  contentCacheDuration: 24h
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: victoriametrics-prom
