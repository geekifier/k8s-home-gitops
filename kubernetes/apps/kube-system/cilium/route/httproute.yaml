---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/gateway.networking.k8s.io/httproute_v1.json
# Hubble UI; the Cilium chart renders no HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  labels:
    auth.xenu.internal/method: sso
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "hubble.${SECRET_DOMAIN_INT}"
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
