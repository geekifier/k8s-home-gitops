---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  # Reserved: 192.168.1.90 for the envoy-internal Gateway.
  blocks:
    - start: "192.168.1.81"
      stop: "192.168.1.99"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Talos assigns the IPv4 LAN to this interface on every node. The unused
  # eno1 has no IPv4 address and cannot send gratuitous ARP for these VIPs.
  interfaces:
    - ^enp1s0f0$
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
