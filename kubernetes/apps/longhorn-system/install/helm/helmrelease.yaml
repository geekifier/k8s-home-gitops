# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: 1.12.1
  values:
    httproute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
      hostnames:
        - "longhorn.${SECRET_DOMAIN_INT}"
    metrics:
      serviceMonitor:
        enabled: true
    defaultSettings:
      defaultDataLocality: best-effort
      defaultReplicaCount: "2"
      replicaAutoBalance: least-effort
      allowVolumeCreationWithDegradedAvailability: false
      nodeDrainPolicy: allow-if-replica-is-stopped
      disableSchedulingOnCordonedNode: true
      storageReservedPercentageForDefaultDisk: 0
    persistence:
      defaultClassReplicaCount: 2
  # The chart can't label its HTTPRoute.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: longhorn-httproute
            patch: |
              - op: add
                path: /metadata/labels/auth.xenu.internal~1method
                value: sso
  interval: 60m
  # upgrade:
  #   remediation:
  #     strategy: rollback
  #     retries: 5
