---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
# Longhorn's manager NetworkPolicy blocks cross-namespace metrics scrapes.
# Allow vmagent through an additive policy, preserving the chart's restrictions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-vmagent
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 9500
          protocol: TCP
