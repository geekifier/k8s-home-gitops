---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-oci
spec:
  interval: 5m
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
  ref:
    tag: 0.87.0
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-metrics
spec:
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  dependsOn:
    - name: longhorn-release
      namespace: longhorn-system
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-oci
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: vm-kube-state-metrics-cm
  values:
    fullnameOverride: *app
    # -- Tenant to use for Grafana datasources and remote write
    tenant: "0"
    # -- VictoriaMetrics Operator dependency chart configuration. More values can be found [here](https://docs.victoriametrics.com/helm/victoriametrics-operator#parameters). Also checkout [here](https://docs.victoriametrics.com/operator/vars) possible ENV variables to configure operator behaviour
    victoria-metrics-operator:
      enabled: true
      # Chart 0.87.0 vendors operator subchart 0.66.* (appVersion v0.73.1), whose
      # generated Role grants the config-reloader only [get, watch] on the config
      # Secret. Its reflector also needs `list`, so vmagent/vmsingle silently keep
      # their boot-time scrape config forever. Subchart pins can't be overridden
      # (Helm resolves them at package time), so pin the image instead.
      # https://github.com/VictoriaMetrics/operator/issues/2384 (fixed in v0.74.0)
      # https://github.com/VictoriaMetrics/helm-charts/issues/3136 (chart side, open)
      # REMOVE once the stack chart vendors operator subchart >= 0.67.0.
      image:
        tag: v0.74.0
      crds:
        plain: true
        cleanup:
          enabled: true
      serviceMonitor:
        enabled: true
      operator:
        # -- By default, operator converts prometheus-operator objects.
        disable_prometheus_converter: false
        # Delete the VM version of prom resources if the prom resources are deleted
        enable_converter_ownership: true

    defaultDashboards:
      # -- Enable custom dashboards installation
      enabled: true
      labels: {}
      annotations: {}
      grafanaOperator:
        # -- Create dashboards as CRDs (requires grafana-operator to be installed)
        enabled: false
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: true
      # -- Create dashboards as ConfigMap despite dependency it requires is not installed
      dashboards:
        victoriametrics-vmalert:
          enabled: true
        victoriametrics-operator:
          enabled: true
        # -- In ArgoCD using client-side apply this dashboard reaches annotations size limit and causes k8s issues without server side apply
        # See [this issue](https://github.com/VictoriaMetrics/helm-charts/tree/disable-node-exporter-dashboard-by-default/charts/victoria-metrics-k8s-stack#metadataannotations-too-long-must-have-at-most-262144-bytes-on-dashboards)
        node-exporter-full:
          enabled: true

    # -- Create default rules for monitoring the cluster
    defaultRules:
      # As of chart 0.87.0 the default rules are no longer templated by Helm.
      # A sync-job fetches them from the upstream URLs in `defaultRules.sources`
      # and applies them as VMRules labelled `managed-by: sync-job`. Only the
      # keys below are read by that job -- `helm template` renders no VMRule at
      # all, so a rule override cannot be verified from the rendered manifests.
      # Check the `victoria-metrics-sync-job-config` ConfigMap instead.
      #
      # Group keys must be the real Prometheus group name (`kube-scheduler.rules`,
      # not `kubeScheduler`).

      # -- Labels, which are used for grouping results of the queries. Note that these labels are joined with `.Values.global.clusterLabel`
      extraGroupByLabels: []
      enabled: true

      # -- Common properties for VMRule groups
      group:
        spec: {}

      # -- Common properties for all VMRules
      rule:
        spec:
          # -- Additional labels for all VMRules
          labels: {}
          # -- Additional annotations for all VMRules
          annotations: {}

      # -- Common properties for VMRules alerts
      alerting:
        spec:
          # -- Additional labels for VMRule alerts
          labels: {}
          # -- Additional annotations for VMRule alerts
          annotations: {}

      # -- Common properties for VMRules recording rules
      recording:
        spec:
          # -- Additional labels for VMRule recording rules
          labels: {}
          # -- Additional annotations for VMRule recording rules
          annotations: {}

      # -- Per rule properties
      rules:
        KubePodCrashLooping:
          spec:
            labels:
              severity: critical
        KubeDeploymentReplicasMismatch:
          spec:
            labels:
              severity: critical
        KubeDeploymentRolloutStuck:
          spec:
            labels:
              severity: critical
        KubeStatefulSetReplicasMismatch:
          spec:
            labels:
              severity: critical
        KubeDaemonSetRolloutStuck:
          spec:
            labels:
              severity: critical
        # Talos has no systemd; node-exporter exposes no node_systemd_* metrics.
        NodeSystemdServiceFailed:
          enabled: false
        NodeSystemdServiceCrashlooping:
          enabled: false
        # No software RAID (node_md_* absent).
        NodeRAIDDegraded:
          enabled: false
        NodeRAIDDiskFailure:
          enabled: false
        # Alertmanager runs as a single replica, so no clustering metrics are
        # emitted.
        AlertmanagerClusterDown:
          enabled: false
        AlertmanagerClusterCrashlooping:
          enabled: false
        AlertmanagerClusterFailedPeers:
          enabled: false
        AlertmanagerClusterFailedToSendAlerts:
          enabled: false
        AlertmanagerMembersInconsistent:
          enabled: false
        AlertmanagerConfigInconsistent:
          enabled: false

        # Recording rule, not an alert. Its join
        # (`on(cluster,namespace,pod) ... node_namespace_pod:kube_pod_info:`)
        # can never match because the node-exporter scrape rewrites `pod` to
        # "{{service}}-{{node}}" (see relabelConfigs further down), while
        # kube_pod_info carries the real pod name.
        # This might need to be investigated further / fixed holistically.
        node:node_num_cpu:sum:
          enabled: false
      # -- Rule group properties
      # Only overrides belong here. Every group not listed is created with the
      # chart's defaults; listing one with `enabled: true` is a no-op that the
      # sync-job drops on the floor.
      groups:
        # Disabled: these groups consume apiserver_request_sli_duration_seconds_*,
        # which is dropped at scrape time by the kubeApiServer drop_metrics rule
        # ("apiserver_.*_duration.*") to keep apiserver ingestion down. With no
        # input the 5 availability recording rules emit 0 samples (firing
        # RecordingRulesNoData), and the 4 KubeAPIErrorBudgetBurn alerts in
        # kube-apiserver-slos can never fire because they read the burnrate
        # recording rules, which are themselves disabled below.
        # Re-enabling requires restoring the SLI histogram at ingestion.
        kube-apiserver-availability.rules:
          enabled: false
        kube-apiserver-slos:
          enabled: false
        kube-apiserver-burnrate.rules:
          enabled: false
        kube-apiserver-histogram.rules:
          enabled: false
        # Disabled: emits count:up0 / count:up1 only. count:up0 is
        # `count(up == 0)`, which returns no series precisely when every target
        # is healthy -- so it trips RecordingRulesNoData during normal
        # operation. Neither series is referenced by any rule or dashboard here.
        kube-prometheus-general.rules:
          enabled: false

      # -- Runbook url prefix for default rules
      runbookUrl: https://runbooks.prometheus-operator.dev/runbooks

      # -- Labels for default rules
      labels: {}
      # -- Annotations for default rules
      annotations: {}

    external:
      grafana:
        # -- External Grafana host
        host: ""
        # -- External Grafana datasource name
        datasource: VictoriaMetrics
      # -- External VM read and write URLs
      vm:
        read:
          url: ""
          # bearerTokenSecret:
          #   name: dbaas-read-access-token
          #   key: bearerToken
        write:
          url: ""
          # bearerTokenSecret:
          #   name: dbaas-read-access-token
          #   key: bearerToken

    vmsingle:
      annotations: {}
      enabled: true
      spec:
        # Existing deployment port, do not remove.
        port: "8429"
        # -- Data retention period. Possible units character: h(ours), d(ays), w(eeks), y(ears), if no unit character specified - month. The minimum retention period is 24h. See these [docs](https://docs.victoriametrics.com/single-server-victoriametrics/#retention)
        retentionPeriod: "1" # 1 month
        replicaCount: 1
        extraArgs: {}
        storage:
          storageClassName: longhorn-standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 1024Mi
          limits:
            memory: 3096Mi
        # Soft anti-affinity: avoid tinykube02 (lowest-endurance SSD); still allowed
        # if no other node is available.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: ["tinykube02"]
      ingress:
        enabled: true
        annotations: {}
        labels: {}
        path: ""
        pathType: Prefix
        ingressClassName: "internal"
        hosts:
          - "vm-k8s.${SECRET_DOMAIN_INT}"
        #  - vmsingle.domain.com
        # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service

        # -- Array of TLS objects
        tls: []
        #  - secretName: vmsingle-ingress-tls
        #    hosts:
        #      - vmsingle.domain.com

    vmcluster:
      enabled: false

    alertmanager:
      # -- Create VMAlertmanager CR
      enabled: true
      # -- Alertmanager annotations
      annotations: {}
      # -- (object) Full spec for VMAlertmanager CRD. Allowed values described [here](https://docs.victoriametrics.com/operator/api#vmalertmanagerspec)
      spec:
        replicaCount: 1
        port: "9093"
        selectAllByDefault: true
        externalURL: ""
        routePrefix: /

        # -- (string) If this one defined, it will be used for alertmanager configuration and config parameter will be ignored
        configSecret: ""
      # -- enable storing .Values.alertmanager.config in VMAlertmanagerConfig instead of k8s Secret.
      # Note: VMAlertmanagerConfig and plain Alertmanager config structures are not equal.
      # If you're migrating existing config, please make sure that `.Values.alertmanager.config`:
      # - with `useManagedConfig: false` has structure described [here](https://prometheus.io/docs/alerting/latest/configuration/).
      # - with `useManagedConfig: true` has structure described [here](https://docs.victoriametrics.com/operator/api/#vmalertmanagerconfig).
      useManagedConfig: false
      # -- (object) Alertmanager configuration
      config:
        route:
          receiver: "blackhole"
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - matchers:
                - severity=critical
              receiver: pushover-critical
            - matchers:
                - severity=warning
              receiver: pushover-normal
        inhibit_rules:
          - target_matchers:
              - severity=~"warning|info"
            source_matchers:
              - severity=critical
            equal:
              - namespace
              - alertname
          - target_matchers:
              - severity=info
            source_matchers:
              - severity=warning
            equal:
              - namespace
              - alertname
          - target_matchers:
              - severity=info
            source_matchers:
              - alertname=InfoInhibitor
            equal:
              - namespace
        receivers:
          - name: blackhole
          - name: pushover-critical
            pushover_configs:
              - user_key: "${SECRET_PUSHOVER_USER_KEY}"
                token: "${SECRET_PUSHOVER_API_TOKEN}"
                priority: '{{ if eq .Status "firing" }}1{{ else }}-1{{ end }}'
                title: "{{ .CommonLabels.alertname }}"
                message: >-
                  {{ range .Alerts }}{{ .Annotations.summary }}
                  {{ .Annotations.description }}

                  {{ end }}
                url: "{{ (index .Alerts 0).GeneratorURL }}"
                url_title: "View in vmalert"
          # Same delivery as `pushover-critical`, but priority 0 instead of 1
          # so it obeys quiet hours / silent mode.
          - name: pushover-normal
            pushover_configs:
              - user_key: "${SECRET_PUSHOVER_USER_KEY}"
                token: "${SECRET_PUSHOVER_API_TOKEN}"
                priority: '{{ if eq .Status "firing" }}0{{ else }}-1{{ end }}'
                title: "{{ .CommonLabels.alertname }}"
                message: >-
                  {{ range .Alerts }}{{ .Annotations.summary }}
                  {{ .Annotations.description }}

                  {{ end }}
                url: "{{ (index .Alerts 0).GeneratorURL }}"
                url_title: "View in vmalert"
      # -- Better alert templates for [slack source](https://gist.github.com/milesbxf/e2744fc90e9c41b47aa47925f8ff6512)
      monzoTemplate:
        enabled: true

      # -- (object) Extra alert templates
      templateFiles: {}
        # template_1.tmpl: |-
        #   {{ define "hello" -}}
        #   hello, Victoria!
        #   {{- end }}
        # template_2.tmpl: ""

      # -- (object) Alertmanager ingress configuration
      ingress:
        enabled: true
        ingressClassName: internal
        labels: {}
        path: '{{ .Values.alertmanager.spec.routePrefix | default "/" }}'
        pathType: Prefix

        hosts:
          - "alertmgr.${SECRET_DOMAIN_INT}"
        # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service
        tls: []
        #  - secretName: alertmanager-ingress-tls
        #    hosts:
        #      - alertmanager.domain.com

    vmalert:
      # -- VMAlert annotations
      annotations: {}
      # -- Create VMAlert CR
      enabled: true

      # -- Controls whether VMAlert should use VMAgent or VMInsert as a target for remotewrite
      remoteWriteVMAgent: false
      # -- (object) Full spec for VMAlert CRD. Allowed values described [here](https://docs.victoriametrics.com/operator/api#vmalertspec)
      spec:
        port: "8080"
        selectAllByDefault: true
        evaluationInterval: 30s
        extraArgs:
          http.pathPrefix: "/"

        # External labels to add to all generated recording rules and alerts
        externalLabels: {}

      # -- (object) Extra VMAlert annotation templates
      templateFiles: {}
        # template_1.tmpl: |-
        #   {{ define "hello" -}}
        #   hello, Victoria!
        #   {{- end }}
        # template_2.tmpl: ""

      # -- Allows to configure static notifiers, discover notifiers via Consul and DNS,
      # see specification [here](https://docs.victoriametrics.com/vmalert/#notifier-configuration-file).
      # This configuration will be created as separate secret and mounted to VMAlert pod.
      additionalNotifierConfigs: {}
        # dns_sd_configs:
        #   - names:
        #       - my.domain.com
        #     type: 'A'
        #     port: 9093
      # -- (object) VMAlert ingress config
      ingress:
        enabled: true
        # For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
        # See https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
        ingressClassName: internal
        # Values can be templated
        annotations: {}
          # kubernetes.io/ingress.class: nginx
          # kubernetes.io/tls-acme: "true"
        labels: {}
        path: ""
        pathType: Prefix

        hosts:
          - "vmalert.${SECRET_DOMAIN_INT}"
        # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service
        tls: []
        #  - secretName: vmalert-ingress-tls
        #    hosts:
        #      - vmalert.domain.com

    vmauth:
      # -- Enable VMAuth CR
      enabled: false
      # -- VMAuth annotations
      annotations: {}
      # -- (object) Full spec for VMAuth CRD. Allowed values described [here](https://docs.victoriametrics.com/operator/api#vmauthspec)
      # It's possible to use given below predefined variables in spec:
      # * `{{ .vm.read }}` - parsed vmselect, vmsingle or external.vm.read URL
      # * `{{ .vm.write }}` - parsed vminsert, vmsingle or external.vm.write URL
      spec:
        port: "8427"
        unauthorizedUserAccessSpec:
          # -- Flag, that allows to disable default VMAuth unauthorized user access config
          disabled: false
          discover_backend_ips: true
          url_map:
            - src_paths:
                - "{{ .vm.read.path }}/.*"
              url_prefix:
                - '{{ urlJoin (omit .vm.read "path") }}/'
            - src_paths:
                - "{{ .vm.write.path }}/.*"
              url_prefix:
                - '{{ urlJoin (omit .vm.write "path") }}/'

    vmagent:
      enabled: true
      annotations: {}
      # -- Remote write configuration of VMAgent, allowed parameters defined in a [spec](https://docs.victoriametrics.com/operator/api#vmagentremotewritespec)
      additionalRemoteWrites: []
      # -- (object) Full spec for VMAgent CRD. Allowed values described [here](https://docs.victoriametrics.com/operator/api#vmagentspec)
      spec:
        port: "8429"
        selectAllByDefault: true
        scrapeInterval: 30s
        externalLabels: {}
          # For multi-cluster setups it is useful to use "cluster" label to identify the metrics source.
          # For example:
          # cluster: cluster-name
        # extraArgs:
        ## switched to per-source streamParse toggle and automatic detection based on `promscrape.minResponseSizeForStreamParse`
        # promscrape.streamParse: "true"
        ## Do not store original labels in vmagent's memory by default. This reduces the amount of memory used by vmagent
        ## but makes vmagent debugging UI less informative. See: https://docs.victoriametrics.com/vmagent/#relabel-debug
        # promscrape.dropOriginalLabels: "true"
        inlineRelabelConfig:
          - action: labeldrop
            regex: prometheus
          # grpc_server_handled_total is deliberately kept — it feeds the active
          # etcdHighNumberOfFailedGRPCRequests alert.
          - action: drop
            source_labels: [__name__]
            regex: longhorn_rest_client_.*_seconds_bucket|prober_probe_duration_seconds_bucket|(longhorn_)?workqueue_(queue|work)_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|container_tasks_state|container_memory_failures_total|kubernetes_feature_enabled
          # Drop per-interface container_network_* noise from cadvisor: ephemeral cilium veths
          # (lxc*/veth*) and tunnel/virtual interfaces. Keeps eth0 (real pod traffic) and the
          # node's physical NICs.
          - action: drop
            source_labels: [interface]
            regex: lxc.*|cilium.*|sit0|tunl0|ip6tnl0|teql0|dummy0|veth.*
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        staticScrapeNamespaceSelector: {}
        staticScrapeSelector:
          matchExpressions:
            - key: vm-target
              operator: NotIn
              values:
                - external
      # -- (object) VMAgent ingress configuration
      ingress:
        enabled: true
        ingressClassName: internal
        # Values can be templated
        annotations: {}
          # kubernetes.io/ingress.class: nginx
          # kubernetes.io/tls-acme: "true"
        labels: {}
        path: ""
        pathType: Prefix

        hosts:
          - "vmagent.${SECRET_DOMAIN_INT}"
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service
        tls: []
        #  - secretName: vmagent-ingress-tls
        #    hosts:
        #      - vmagent.domain.com

    defaultDatasources:
      grafanaOperator:
        # -- Create datasources as CRDs (requires grafana-operator to be installed)
        enabled: false
        annotations: {}
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
          allowCrossNamespaceImport: false
      # -- List of prometheus compatible datasource configurations.
      # VM `url` will be added to each of them in templates.
      # uid deviates from the chart default (VictoriaMetrics / VictoriaMetricsDS)
      # to match the `<backend>-<type>` convention used by the extra datasources
      # below. Changing a uid orphans dashboards that pinned the old one.
      victoriametrics:
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: victoriametrics-prom
            isDefault: true
          - name: VictoriaMetrics (DS)
            isDefault: false
            access: proxy
            uid: victoriametrics-vm
            type: victoriametrics-metrics-datasource
      # -- List of alertmanager datasources.
      # Alertmanager generated `url` will be added to each datasource in template if alertmanager is enabled
      alertmanager:
        datasources:
          - name: Alertmanager
            access: proxy
            uid: Alertmanager
            jsonData:
              implementation: prometheus
      # -- Configure additional grafana datasources (passed through tpl).
      # Check [here](http://docs.grafana.org/administration/provisioning/#datasources) for details
      extra:
        - name: vm-historical-prom
          access: proxy
          isDefault: false
          url: "http://vmsingle-external.observability.svc.cluster.local:8429/"
          type: prometheus
          uid: vm-historical-prom
        - name: vm-historical-vm
          access: proxy
          isDefault: false
          url: "http://vmsingle-external.observability.svc.cluster.local:8429/"
          type: victoriametrics-metrics-datasource
          uid: vm-historical-vm
        # - name: prometheus-sample
        #   access: proxy
        #   basicAuth: true
        #   basicAuthPassword: pass
        #   basicAuthUser: daco
        #   editable: false
        #   jsonData:
        #     tlsSkipVerify: true
        #   orgId: 1
        #   type: prometheus
        #   url: https://{{ printf "%s-prometheus.svc" .Release.Name }}:9090
        #   version: 1

    # -- Grafana dependency chart configuration. For possible values refer [here](https://github.com/grafana/helm-charts/tree/main/charts/grafana#configuration)
    grafana:
      enabled: true
      # Replaces defaultDashboards.defaultTimezone, which chart 0.85.x removed
      # with no equivalent value. Applies to dashboards whose timezone field is
      # "" (the majority); dashboards that hardcode "browser" keep that setting.
      grafana.ini:
        date_formats:
          default_timezone: America/Indiana/Indianapolis
      deploymentStrategy:
        type: Recreate
      admin:
        existingSecret: victoria-metrics-grafana-secret
      persistence:
        type: pvc
        # Tired of issues with grafana persistent storage
        enabled: true
        size: 512Mi
        storageClassName: longhorn-standard
        accessmodes:
          - ReadWriteOnce
      # all values for grafana helm chart can be specified here
      sidecar:
        datasources:
          enabled: true
          # Must stay false: the chart's datasources init path is buggy.
          # `initDatasources: true` moves k8s-sidecar from a normal container to
          # a plain initContainer, which has to be one-shot to ever exit. The
          # alerts and notifiers init paths handle that -- they force
          # METHOD=LIST unless restartPolicy is Always (a native sidecar, where
          # long-running is legal). The datasources path has no such guard: it
          # passes `watchMethod` straight through, and that defaults to WATCH.
          # k8s-sidecar in WATCH mode never returns, so the initContainer hangs
          # and Grafana's own container is never started.
          # If this is ever needed, set `watchMethod: LIST` alongside it.
          initDatasources: false
          skipReload: false
          label: grafana_datasource
          searchNamespace: ALL
        dashboards:
          provider:
            name: default
            orgid: 1
            foldersFromFilesStructure: true
            disableDeletion: false
            # useful to prototype changes
            allowUiUpdates: true
          folderAnnotation: grafana_folder
          enabled: true
          multicluster: false
          searchNamespace: ALL

      # -- Create datasource configmap even if grafana deployment has been disabled
      forceDeployDatasource: false

      # VictoriaMetrics Datasource plugin for Grafana
      # Note that Grafana will need internet access to install the datasource plugin.
      plugins:
        - victoriametrics-metrics-datasource
        # broken
        # - grafana-clock-panel
      # plugins are re-downloaded on every start; keep the churn off the PVC
      extraEmptyDirMounts:
        - name: grafana-plugins
          mountPath: /var/lib/grafana/plugins
      env:
        GF_AUTH_PROXY_ENABLED: "true"
        GF_AUTH_PROXY_HEADER_NAME: Remote-User
        GF_AUTH_PROXY_HEADERS: "Name:Remote-Name Email:Remote-Email Groups:Remote-Groups"
        GF_AUTH_PROXY_WHITELIST: "100.64.0.0/16" # replace with interpolated var
        GF_USERS_HOME_PAGE: /dashboards
        GF_DEFAULT_TIMEZONE: ${CLUSTER_TZ}
      ingress:
        enabled: true
        ingressClassName: internal
        # Values can be templated
        annotations:
          nginx.ingress.kubernetes.io/auth-method: "GET"
          nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local:9091/api/authz/auth-request"
          nginx.ingress.kubernetes.io/auth-signin: "https://auth-k8s.${SECRET_DOMAIN_INT}?rm=$request_method"
          nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Name,Remote-Groups,Remote-Email"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/pod-selector: app.kubernetes.io/name=grafana
          gethomepage.dev/group: Admin
          gethomepage.dev/name: Grafana (K8s)
          gethomepage.dev/icon: grafana
        labels: {}
        path: /
        pathType: Prefix

        hosts:
          - "grafana-k8s.${SECRET_DOMAIN_INT}"
        # -- Extra paths to prepend to every host configuration. This is useful when working with annotation based services.
        extraPaths: []
        # - path: /*
        #   pathType: Prefix
        #   backend:
        #     service:
        #       name: ssl-redirect
        #       port:
        #         name: service
        tls: []
        #  - secretName: grafana-ingress-tls
        #    hosts:
        #      - grafana.domain.com

      # -- Grafana VM scrape config
      vmScrape:
        # whether we should create a service scrape resource for grafana
        enabled: true

        # -- [Scrape configuration](https://docs.victoriametrics.com/operator/api#vmservicescrapespec) for Grafana
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: '{{ include "grafana.name" .Subcharts.grafana }}'
          endpoints:
            - port: "{{ .Values.grafana.service.portName }}"

    # -- prometheus-node-exporter dependency chart configuration. For possible values check [here](https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-node-exporter/values.yaml)
    prometheus-node-exporter:
      enabled: true

      # all values for prometheus-node-exporter helm chart can be specified here
      # -- Node Exporter VM scrape config
      vmScrape:
        # whether we should create a service scrape resource for node-exporter
        enabled: true

        # -- [Scrape configuration](https://docs.victoriametrics.com/operator/api#vmservicescrapespec) for Node Exporter
        spec:
          jobLabel: jobLabel
          selector:
            matchLabels:
              app.kubernetes.io/name: '{{ include "prometheus-node-exporter.name" (index .Subcharts "prometheus-node-exporter") }}'
          endpoints:
            - port: metrics
              interval: 1m
              vm_scrape_params:
                stream_parse: true
              relabelConfigs:
                # These are set at the target level rather than the metric level,
                # so it should be replaced once here instead of on every single metric.
                # Replace the instance name (something like 10.3.1.1:9100) with the node name
                # (something like talos-k8s-mixed-01).
                - source_labels:
                    - __meta_kubernetes_pod_node_name
                  action: replace
                  target_label: instance
                # Rename the pod label metrics. This causes churn every time the pods are restarted.
                # There should always be a 1:1 mapping between a pod and a node, so this label is redundant.
                # However, it could still be useful for "meta" queries, like the number of metrics exported
                # by each pod.
                - action: replace
                  target_label: pod
                  # This uses VM-specific features.
                  # Helm is templating this which is why `printf` is needed
                  replacement: '{{ printf "{{service}}-{{__meta_kubernetes_pod_node_name}}" }}'
              metricRelabelConfigs:
                - action: drop
                  source_labels: [mountpoint]
                  regex: "/var/lib/kubelet/pods.+"
    # -- kube-state-metrics dependency chart configuration. For possible values check [here](https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-state-metrics/values.yaml)
    kube-state-metrics:
      enabled: true
      metricLabelsAllowlist:
        - "pods=[app,app.kubernetes.io/instance]"
      # -- [Scrape configuration](https://docs.victoriametrics.com/operator/api#vmservicescrapespec) for Kube State Metrics
      vmScrape:
        enabled: true
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: '{{ include "kube-state-metrics.name" (index .Subcharts "kube-state-metrics") }}'
              app.kubernetes.io/instance: '{{ include "vm.release" . }}'
          endpoints:
            - port: http
              honorLabels: true
              interval: 1m
              vm_scrape_params:
                stream_parse: true
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid|container_id|image_id)
          jobLabel: app.kubernetes.io/name

    # -- Component scraping the kubelets
    kubelet:
      enabled: true
      vmScrapes:
        # -- Enable scraping /metrics/cadvisor from kubelet's service
        cadvisor:
          enabled: true
          spec:
            path: /metrics/cadvisor
            vm_scrape_params:
              stream_parse: true
        # -- Enable scraping /metrics/probes from kubelet's service
        probes:
          enabled: true
          spec:
            path: /metrics/probes
        # -- Enabled scraping /metrics/resource from kubelet's service
        resources:
          enabled: true
          spec:
            path: /metrics/resource
        kubelet:
          spec: {}
      # -- Spec for VMNodeScrape CRD is [here](https://docs.victoriametrics.com/operator/api.html#vmnodescrapespec)
      vmScrape:
        kind: VMNodeScrape
        spec:
          scheme: "https"
          honorLabels: true
          interval: "60s"
          scrapeTimeout: "5s"
          vm_scrape_params:
            stream_parse: true
          tlsConfig:
            insecureSkipVerify: true
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          # drop high cardinality label and useless metrics for cadvisor and kubelet
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
            - action: labeldrop
              regex: (feature_node|extensions_talos_dev|beta_kubernetes|plan_upgrade_cattle_io|openebs_io|katacontainers_io|topology_rook_io_).*
            - action: labeldrop
              regex: .*home_arpa.*
          # ignore timestamps of cadvisor's metrics by default
          # more info here https://github.com/VictoriaMetrics/VictoriaMetrics/issues/4697#issuecomment-1656540535
          honorTimestamps: false
    # Component scraping the kube api server
    kubeApiServer:
      # -- Enable Kube Api Server metrics scraping
      enabled: true
      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api.html#vmservicescrapespec)
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              interval: 1m
              scrapeTimeout: 10s
              # bearerTokenSecret:
              #   key: ""
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                # VM-enhanced drop_metrics syntax
                - action: drop_metrics
                  regex:
                    - "apiserver_.*_duration.*"
                    - "apiserver_.*_body.*"
                    - "apiserver_.*sizes.*"
                    - "apiserver_(storage_list_|watch_cache_|flowcontrol_).*"
                    - "etcd_request(s_total|_duration.*)"
          jobLabel: component
          namespaceSelector:
            matchNames:
              - default
          selector:
            matchLabels:
              component: apiserver
              provider: kubernetes

    # Component scraping the kube controller manager
    kubeControllerManager:
      # -- Enable kube controller manager metrics scraping
      enabled: true

      # -- If your kube controller manager is not deployed as a pod, specify IPs it can be found on
      endpoints: []
      # If using kubeControllerManager.endpoints only the port and targetPort are used
      service:
        # -- Create service for kube controller manager metrics scraping
        enabled: true
        # -- Kube controller manager service port
        port: 10257
        # -- Kube controller manager service target port
        targetPort: 10257
        # -- Kube controller manager service pod selector
        selector:
          component: kube-controller-manager

      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api.html#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          # insecureSkipVerify is required for Talos
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
                insecureSkipVerify: true

    # Component scraping kubeDns. Use either this or coreDns
    kubeDns:
      # -- Enabled KubeDNS metrics scraping
      enabled: false
      service:
        # -- Create Service for KubeDNS metrics
        enabled: false
        # -- KubeDNS service ports
        ports:
          dnsmasq:
            port: 10054
            targetPort: 10054
          skydns:
            port: 10055
            targetPort: 10055
        # -- KubeDNS service pods selector
        selector:
          k8s-app: kube-dns
      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api.html#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          namespaceSelector:
            matchNames: []
          endpoints:
            - port: http-metrics-dnsmasq
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            - port: http-metrics-skydns
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

    # Component scraping coreDns. Use either this or kubeDns
    coreDns:
      # -- Enabled CoreDNS metrics scraping
      enabled: true
      service:
        # -- Create service for CoreDNS metrics
        enabled: true
        # -- CoreDNS service port
        port: 9153
        # -- CoreDNS service target port
        targetPort: 9153
        # -- CoreDNS service pod selector
        selector:
          k8s-app: kube-dns

      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api.html#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          namespaceSelector:
            matchNames: []
          endpoints:
            - port: http-metrics
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              interval: 1m

    # Component scraping etcd
    kubeEtcd:
      # -- Enabled KubeETCD metrics scraping
      enabled: true
      service:
        enabled: true
        targetPort: 2381
        selector:
          k8s-app: kube-controller-manager
          component: ~
      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api.html#vmservicescrapespec)
      vmScrape:
        spec:
          endpoints:
            # Required to work with Talos
            - port: http-metrics
              scheme: http

    # Component scraping kube scheduler
    kubeScheduler:
      # -- Enable KubeScheduler metrics scraping
      enabled: true

      # -- If your kube scheduler is not deployed as a pod, specify IPs it can be found on
      endpoints: []

      # If using kubeScheduler.endpoints only the port and targetPort are used
      service:
        # -- Enable service for KubeScheduler metrics scrape
        enabled: true
        # -- KubeScheduler service port
        port: 10259
        # -- KubeScheduler service target port
        targetPort: 10259
        # -- KubeScheduler service pod selector
        selector:
          component: kube-scheduler

      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api.html#vmservicescrapespec)
      # insecureSkipVerify is required for Talos
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecureSkipVerify: true

    # Component scraping kube proxy
    kubeProxy:
      enabled: false

      # -- Spec for VMServiceScrape CRD is [here](https://docs.victoriametrics.com/operator/api.html#vmservicescrapespec)
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          namespaceSelector:
            matchNames: []
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              # bearerTokenSecret:
              #   key: ""
              port: http-metrics
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    # -- Add extra objects dynamically to this chart
    extraObjects: []

  interval: 30m
