---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  # Based on tuppr chart 0.5.7; preserve its UID and use a separate sidecar filename.
  # MetricsQL increase_pure includes the first observation of lazily created counters.
  - name: grafana-dashboard-tuppr
    files:
      - ./json/tuppr-operational.json

  - name: grafana-dashboard-coredns
    files:
      - ./json/coredns-resolver.json
    options:
      annotations:
        grafana_folder: "infra"

  - name: grafana-dashboard-ha-house
    files:
      - ./json/ha-house.json

  - name: grafana-dashboard-ping-exporter
    files:
      - ./json/network-ping-exporter.json
    options:
      annotations:
        grafana_folder: "network"

  - name: grafana-dashboard-blackbox
    files:
      - ./json/network-blackbox.json
    options:
      annotations:
        grafana_folder: "network"

  - name: grafana-dashboard-proxmox-cluster
    files:
      - ./json/proxmox-cluster.json
    options:
      annotations:
        grafana_folder: "infra"

  - name: grafana-dashboard-samba
    files:
      - ./json/samba-service.json
    options:
      annotations:
        grafana_folder: "storage"

  - name: grafana-dashboard-traefik-ext
    files:
      - ./json/traefik-ext.json
    options:
      annotations:
        grafana_folder: "infra"

  - name: grafana-dashboard-external-filesystems
    files:
      - ./json/external-filesystems.json
    options:
      annotations:
        grafana_folder: "storage"
generatorOptions:
  # see if this prevents dashboards from "disappearing" in the UI during updates
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
