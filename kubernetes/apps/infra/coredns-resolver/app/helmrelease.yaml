---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/helm.toolkit.fluxcd.io/helmrelease_v2.json
# This deployment is used as an HA-enabled home network DNS resolver with a distributed cache.
# It is separate from the kubernetes coredns deployment.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns-resolver
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: coredns
    namespace: kube-system
  install:
    remediation:
      retries: -1
  # Preserve distinct UDP/TCP entries sharing port 53 during updates and rollbacks.
  rollback:
    serverSideApply: enabled
  upgrade:
    serverSideApply: enabled
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # The chart keeps the Corefile in its runtime ConfigMap; the reload plugin
    # continues to reload CoreDNS gracefully when that configuration changes.
    # https://github.com/coredns/helm/blob/master/charts/coredns/values.yaml
    image:
      repository: ghcr.io/geekifier/coredns
      tag: 1.14.7-redis_cache@sha256:e99f89e65d88292de46e79cf0fa29ac759a30d6433e8a77acf5ef1df0f323445
      pullSecrets:
        - name: ghcr-login-secret
    isClusterService: false
    rbac:
      create: false
    fullnameOverride: &app coredns-resolver
    serviceAccount:
      create: false
    prometheus:
      service:
        enabled: true
        # This needs to be fixed with a PR
        # https://github.com/coredns/helm/blob/master/charts/coredns/templates/service-metrics.yaml#L17
        annotations:
      monitor:
        enabled: true
    serviceType: LoadBalancer
    service:
      loadBalancerIP: "192.168.1.81"
      # Keeps the L2 lease from following pod rollouts.
      externalTrafficPolicy: Cluster
      annotations:
        lbipam.cilium.io/ips: "192.168.1.81"
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    replicaCount: 3
    podLabels:
      access.policy.xenu.internal/db.dragonfly-shared: "true"
    # The image runs as non-root without file capabilities.
    podSecurityContext:
      runAsNonRoot: true
      sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "53"
    servers:
      - zones:
          - zone: ${SECRET_DOMAIN_INT}
        port: &dnsPort 53
        plugins: &plugins
          - name: log
            configBlock: |-
              class error
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . 192.168.1.30 192.168.1.31
          - name: cache
            configBlock: |-
              success 9984 1800
              denial 1000 30
              serve_stale 4h verify
      - zones:
          - zone: 192.168.1.0/24
        port: *dnsPort
        plugins: *plugins
      - zones:
          - zone: 192.168.2.0/24
        port: *dnsPort
        plugins: *plugins
      - zones:
          - zone: 192.168.3.0/24
        port: *dnsPort
        plugins: *plugins
      - zones:
          - zone: 192.168.4.0/24
        port: *dnsPort
        plugins: *plugins
      - zones:
          - zone: .
            # Expose TCP alongside UDP on the shared DNS service port.
            use_tcp: true
        port: *dnsPort
        plugins:
          - name: forward
            parameters: >-
              . tls://162.159.36.5%${SECRET_DOT_UPSTREAM_NAME}
              tls://162.159.36.20%${SECRET_DOT_UPSTREAM_NAME}
              tls://1.1.1.3%family.cloudflare-dns.com
              tls://1.0.0.3%family.cloudflare-dns.com
              tls://185.228.169.11%adult-filter-dns.cleanbrowsing.org
              tls://185.228.168.10%adult-filter-dns.cleanbrowsing.org
            configBlock: |-
              policy sequential
              health_check 1s
          - name: errors
          - name: log
            configBlock: |-
              class error
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: loop
          - name: reload
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: cache
            configBlock: |-
              success 9984 1800
              denial 1000 30
              serve_stale 4h immediate
          - name: redis_cache
            configBlock: |-
              success 1800
              denial 30
              endpoint 100.65.79.243:6379
              key_prefix coredns-resolver-v1
              timeout {
                connect 200ms
                read 200ms
                write 200ms
              }

    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
