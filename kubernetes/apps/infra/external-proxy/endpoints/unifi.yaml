# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/backendtlspolicy_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: unifi-proxy
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: unifi-proxy
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: unifi-proxy-ca
    hostname: unifi.local
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
  labels:
    auth.xenu.internal/method: app
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - unifi.${SECRET_DOMAIN_INT}
  rules:
    - backendRefs:
        - name: unifi-proxy
          port: 443
