---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mumble-server
  namespace: &namespace default
spec:
  dependsOn:
    - name: mumble-server-db
      namespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/default/mumble-server/app
  postBuild:
    substituteFrom:
      - name: cluster-settings
        kind: ConfigMap
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 2m
  wait: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mumble-server-db
  namespace: default
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: db
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      failed: &failed >-
        has(status.applied) && !status.applied &&
        has(status.observedGeneration) && status.observedGeneration == metadata.generation
      current: &current >-
        has(status.applied) && status.applied &&
        has(status.observedGeneration) && status.observedGeneration == metadata.generation
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      failed: *failed
      current: *current
  interval: 30m
  path: ./kubernetes/apps/default/mumble-server/db
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: db
  timeout: 5m
  wait: true
