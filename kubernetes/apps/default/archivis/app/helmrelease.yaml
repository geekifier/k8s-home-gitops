# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app archivis
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    ingress:
      app:
        annotations:
          nginx.ingress.kubernetes.io/auth-method: "GET"
          nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local:9091/api/authz/auth-request"
          nginx.ingress.kubernetes.io/auth-signin: "https://auth-k8s.${SECRET_DOMAIN_INT}?rm=$request_method"
          nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Name,Remote-Groups,Remote-Email"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/pod-selector: app.kubernetes.io/name=archivis
          gethomepage.dev/group: Media
          gethomepage.dev/name: Archivis
          gethomepage.dev/icon: mdi-bookshelf
          gethomepage.dev/description: Book Library
        enabled: true
        className: internal
        hosts:
          - host: &host "books.${SECRET_DOMAIN_INT}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    controllers:
      archivis:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/geekifier/archivis
              tag: sha-91a6237
            env:
              TZ: ${CLUSTER_TZ}
              ARCHIVIS_PUBLIC_BASE_URL: https://books.${SECRET_DOMAIN_INT}
              # Proxy auth — Authelia sends Remote-* headers
              ARCHIVIS_AUTH__PROXY__ENABLED: "true"
              ARCHIVIS_AUTH__PROXY__TRUSTED_PROXIES: "[100.64.0.0/16]"
              ARCHIVIS_AUTH__PROXY__USER_HEADER: Remote-User
              ARCHIVIS_AUTH__PROXY__EMAIL_HEADER: Remote-Email
              ARCHIVIS_AUTH__PROXY__GROUPS_HEADER: Remote-Groups
            envFrom:
              - secretRef:
                  name: archivis-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: &containerPort 9514
                  periodSeconds: 2
                  failureThreshold: 15 # 30s budget — 240x measured p50, 6x estimated p99
                  timeoutSeconds: 2
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: *containerPort
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: *containerPort
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 1024Mi
            securityContext:
              allowPrivilegeEscalation: false
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *containerPort
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        size: 4Gi
        accessMode: ReadWriteOnce
        storageClass: longhorn-standard
        globalMounts:
          - path: /data
      books:
        enabled: true
        type: persistentVolumeClaim
        size: 16Gi
        accessMode: ReadWriteOnce
        storageClass: longhorn-standard
        globalMounts:
          - path: /books
      public:
        enabled: true
        existingClaim: smb-public-pvc
        type: persistentVolumeClaim
        globalMounts:
          - path: /public/Library
            subPath: Library
