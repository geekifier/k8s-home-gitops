---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app booklore
spec:
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
    timeout: 5m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    timeout: 5m
  values:
    controllers:
      booklore:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          booklore:
            image:
              repository: ghcr.io/booklore-app/booklore
              tag: v1.18.5
            env:
              TZ: ${CLUSTER_TZ}
              APP_SERVICE_PORT: &port 6060
              BOOKLORE_PORT: *port
              SWAGGER_ENABLED: true
              REMOTE_AUTH_ENABLED: true
              REMOTE_AUTH_CREATE_NEW_USERS: true
              REMOTE_AUTH_HEADER_USER: Remote-User
              REMOTE_AUTH_HEADER_NAME: Remote-Name
              REMOTE_AUTH_HEADER_EMAIL: Remote-Email
              REMOTE_AUTH_HEADER_GROUPS: Remote-Groups
              REMOTE_AUTH_GROUPS_DELIMITER: "\\s*,\\s*"
              REMOTE_AUTH_ADMIN_GROUP:
                secretKeyRef:
                  name: booklore-secret
                  key: REMOTE_AUTH_ADMIN_GROUP
              DATABASE_URL: jdbc:mariadb://localhost:3306/booklore
              DATABASE_USERNAME:
                secretKeyRef:
                  name: booklore-secret
                  key: MYSQL_USER
              DATABASE_PASSWORD:
                secretKeyRef:
                  name: booklore-secret
                  key: MYSQL_PASSWORD
              PUID: 1000
              PGID: 1000
              LOG_LEVEL: info
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi
          mariadb:
            image:
              repository: docker.io/library/mariadb
              tag: 11.4.5
            env:
              TZ: ${CLUSTER_TZ}
            envFrom:
              - secretRef:
                  name: booklore-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["healthcheck.sh", "--connect"]
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      booklore:
        controller: *app
        ports:
          booklore-http:
            port: 6060
    ingress:
      booklore:
        annotations:
          nginx.ingress.kubernetes.io/auth-method: "GET"
          nginx.ingress.kubernetes.io/auth-url: "http://authelia.auth.svc.cluster.local:9091/api/authz/auth-request"
          nginx.ingress.kubernetes.io/auth-signin: "https://auth-k8s.${SECRET_DOMAIN_INT}?rm=$request_method"
          nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Name,Remote-Groups,Remote-Email"
        className: internal
        hosts:
          - host: &host "booklore.${SECRET_DOMAIN_INT}"
            paths:
              - path: /
                service:
                  identifier: booklore
                  port: booklore-http
    serviceAccount:
      booklore: {}
    persistence:
      app:
        enabled: true
        type: persistentVolumeClaim
        size: 2Gi
        accessMode: ReadWriteOnce
        storageClass: longhorn-standard
        advancedMounts:
          booklore:
            booklore:
              - path: /app/data
      db:
        enabled: true
        type: persistentVolumeClaim
        size: 4Gi
        accessMode: ReadWriteOnce
        storageClass: longhorn-standard
        advancedMounts:
          booklore:
            mariadb:
              - path: /var/lib/mysql
      public:
        enabled: true
        existingClaim: smb-public-pvc
        type: persistentVolumeClaim
        advancedMounts:
          booklore:
            booklore:
              - path: /public/Library
                subPath: Library
              - path: /bookdrop
                subPath: Library/Calibre-Import
      tmp:
        type: emptyDir
        advancedMounts:
          booklore:
            booklore:
              - path: /tmp
      db-run:
        type: emptyDir
        advancedMounts:
          booklore:
            mariadb:
              - path: /var/run/mysqld
      db-tmp:
        type: emptyDir
        advancedMounts:
          booklore:
            mariadb:
              - path: /tmp
