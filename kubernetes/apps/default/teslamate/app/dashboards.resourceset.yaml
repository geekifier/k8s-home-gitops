---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/fluxcd.controlplane.io/resourceset_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: teslamate-dashboards
spec:
  # Directories under grafana/ in teslamate-org/teslamate
  inputs:
    - folder: Teslamate
      dir: dashboards
      dashboards:
        - battery-health
        - charge-level
        - charges
        - charging-stats
        - database-info
        - drive-stats
        - drives
        - efficiency
        - locations
        - mileage
        - overview
        - projected-range
        - states
        - statistics
        - timeline
        - trip
        - updates
        - vampire-drain
        - visited
    - folder: Internal
      dir: dashboards/internal
      dashboards:
        - charge-details
        - drive-details
        - home
  # TESLAMATE_VERSION (ks.yaml) also sets the image tag.
  resourcesTemplate: |
    <<- range inputs.dashboards >>
    ---
    apiVersion: grafana.integreatly.org/v1beta1
    kind: GrafanaDashboard
    metadata:
      name: teslamate-<< . >>
      namespace: << inputs.provider.namespace >>
    spec:
      # The Grafana CR lives in observability
      allowCrossNamespaceImport: true
      instanceSelector:
        matchLabels:
          dashboards: grafana
      folder: << inputs.folder >>
      url: https://raw.githubusercontent.com/teslamate-org/teslamate/v${TESLAMATE_VERSION}/grafana/<< inputs.dir >>/<< . >>.json
    <<- end >>
