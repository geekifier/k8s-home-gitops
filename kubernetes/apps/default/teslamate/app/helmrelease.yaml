---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app teslamate
spec:
  interval: 30m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      # Helm rollback cannot undo database migrations. Investigate failures manually.
      retries: 0
      remediateLastFailure: false
  values:
    controllers:
      teslamate:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: teslamate/teslamate
              tag: ${TESLAMATE_VERSION}
            env:
              TZ: "${CLUSTER_TZ}"
              DATABASE_HOST: postgres17-rw.db.svc.cluster.local
              DATABASE_NAME: teslamate
              DATABASE_USER:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-pgsql
                    key: username
              DATABASE_PASS:
                valueFrom:
                  secretKeyRef:
                    name: teslamate-pgsql
                    key: password
            envFrom:
              - secretRef:
                  name: teslamate-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  # Allow 150 seconds for startup; gates liveness and readiness.
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 25m
                memory: 256Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 4000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://{{ index .Values.route.app.hostnames 0 }}"
          gethomepage.dev/group: Home
          gethomepage.dev/icon: teslamate
          gethomepage.dev/description: Vehicle Stats
          wud.link.template: https://github.com/teslamate-org/teslamate/releases/tag/v$${major}.$${minor}.$${patch}
        labels:
          auth.xenu.internal/method: sso
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - "teslamate.${SECRET_DOMAIN_INT}"
