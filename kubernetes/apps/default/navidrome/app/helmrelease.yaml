# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app navidrome
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      navidrome:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: deluan/navidrome
              tag: "0.64.2"
            env:
              TZ: ${CLUSTER_TZ}
              ND_LOGLEVEL: info
              ND_EXTAUTH_TRUSTEDSOURCES: "100.64.0.0/16" # replace with interpolated value
              ND_ENABLEUSEREDITING: false
              ND_BASEURL: "https://music.${SECRET_DOMAIN_INT}"
              ND_PORT: &port 4533
              ND_MUSICFOLDER: /public/Media/Music
              ND_IMAGECACHESIZE: "500MB"
              ND_SCANNER_SCHEDULE: "@every 4h"
            envFrom:
              - secretRef:
                  name: navidrome-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    networkpolicies:
      app:
        controller: *app
        policyTypes:
          - Ingress
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: network
                  podSelector:
                    matchLabels:
                      gateway.envoyproxy.io/owning-gateway-name: envoy-internal
              ports:
                - port: *port
                  protocol: TCP
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://{{ index .Values.route.app.hostnames 0 }}"
          gethomepage.dev/pod-selector: app.kubernetes.io/name=navidrome
          gethomepage.dev/group: Media
          gethomepage.dev/name: Navidrome (K8s)
          gethomepage.dev/icon: navidrome
        labels:
          auth.xenu.internal/method: sso
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - "music.${SECRET_DOMAIN_INT}"
    persistence:
      data:
        enabled: true
        existingClaim: navidrome-data
        # dealing with fallout from app-template upgrade
        # size: 2Gi
        # storageClass: longhorn-standard
        # accessMode: ReadWriteOnce
      public:
        enabled: true
        existingClaim: smb-public-pvc
        type: persistentVolumeClaim
