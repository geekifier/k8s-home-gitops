---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app miniflux
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      miniflux:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/miniflux/miniflux
              tag: 2.3.3
            env:
              - name: CREATE_ADMIN
                value: 1
              - name: RUN_MIGRATIONS
                value: 1
              - name: BASE_URL
                value: https://rss.${SECRET_DOMAIN_INT}
              - name: AUTH_PROXY_HEADER
                value: Remote-User
              - name: AUTH_PROXY_USER_CREATION
                value: 1
              - name: TRUSTED_REVERSE_PROXY_NETWORKS
                value: 100.64.0.0/16
              - name: DATABASE_URL
                value: host=postgres17-rw.db.svc.cluster.local dbname=miniflux sslmode=require
              - name: PGUSER
                valueFrom:
                  secretKeyRef:
                    name: miniflux-pgsql
                    key: username
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: miniflux-pgsql
                    key: password
            envFrom:
              - secretRef:
                  name: miniflux-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/bin/miniflux", "-healthcheck", "auto"]
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080
    #   app:
    #     serviceName: echo-internal
    #     endpoints:
    #       - port: http
    #         scheme: http
    #         path: /metrics
    #         interval: 1m
    #         scrapeTimeout: 10s
    networkpolicies:
      app:
        controller: *app
        policyTypes:
          - Ingress
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: network
                  podSelector:
                    matchLabels:
                      gateway.envoyproxy.io/owning-gateway-name: envoy-internal
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: default
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: homepage
              ports:
                - port: *port
                  protocol: TCP
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://{{ index .Values.route.app.hostnames 0 }}"
          gethomepage.dev/group: Media
          gethomepage.dev/description: RSS Reader
          gethomepage.dev/widget.type: miniflux
          gethomepage.dev/widget.key: '{{ "{{" }}HOMEPAGE_VAR_MINIFLUX_API_KEY{{ "}}" }}'
          gethomepage.dev/widget.url: http://miniflux.default.svc.cluster.local:8080
          gethomepage.dev/icon: miniflux
        labels:
          auth.xenu.internal/method: sso
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - "rss.${SECRET_DOMAIN_INT}"
