---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &clusterName postgres17
spec:
  instances: 3
  enablePDB: true
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 10
  storage:
    size: 20Gi
    storageClass: longhorn-cluster-best-effort
    resizeInUseVolumes: false
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "128MB"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
  # Query readiness checks SQL service without excluding a disconnected standby
  # from failover. Native upgrade gates use CNPG readiness and role/timeline state.
  probes:
    readiness:
      type: query
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  monitoring:
    enablePodMonitor: true

  backup:
    target: prefer-standby
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres17-garage
        # Preserve the existing archive identity across this migration.
        # A recovered cluster writing a new archive needs a distinct identity.
        serverName: postgres17-02

  bootstrap:
    initdb:
      import:
        type: monolith
        databases: ["*"]
        roles: ["*"]
        source:
          externalCluster: postgres16-source

  externalClusters:
    - name: postgres16-source
      connectionParameters:
        host: postgres16-rw.db.svc.cluster.local
        user: postgres
        dbname: postgres
        port: "5432"
      password:
        name: postgres16-superuser
        key: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres17-daily
  namespace: db
spec:
  schedule: "@daily"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: postgres17
