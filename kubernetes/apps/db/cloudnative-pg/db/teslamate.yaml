---
apiVersion: db.movetokube.com/v1alpha1
kind: Postgres
metadata:
  name: &dbName teslamate
  # the operator is limited to managing resources in the same namespace only
  namespace: db
spec:
  database: *dbName
  dropOnDelete: false
  extensions:
    - cube
    - earthdistance
  schemas:
    - public
---
apiVersion: db.movetokube.com/v1alpha1
kind: PostgresUser
metadata:
  name: &dbName teslamate
  # the operator is limited to managing resources in the same namespace only
  namespace: db
spec:
  role: *dbName
  database: *dbName
  secretName: pgsql
  # OWNER is sufficient for the 4.0.1 -> 4.2.0 migrations (no extension changes).
  # Recheck this for future migrations, extension upgrades may require an administrator.
  privileges: OWNER
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "default,observability"
  secretTemplate:
    DATABASE_HOST: "{{ .Host }}.db.svc.cluster.local"
    DATABASE_USER: "{{.Role}}"
    DATABASE_PASS: "{{.Password}}"
    DATABASE_NAME: "{{.Database}}"
    # We need to set this manually because the value forced by the operator overwrited Teslamate's app port
    PORT: "4000"
