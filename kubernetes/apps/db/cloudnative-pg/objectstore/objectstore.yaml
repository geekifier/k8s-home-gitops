---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres17-garage
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://cloudnative-pg/
    endpointURL: "http://blackhole2.${SECRET_DOMAIN_INT}:3900"
    # serverName belongs in Cluster.spec.plugins[].parameters, not here.
    data:
      compression: bzip2
    wal:
      compression: bzip2
      maxParallel: 1
    s3Credentials:
      region:
        name: cloudnative-pg-garage-secret
        key: CNPG_S3_REGION
      accessKeyId:
        name: cloudnative-pg-garage-secret
        key: CNPG_S3_ACCESS_KEY_ID
      secretAccessKey:
        name: cloudnative-pg-garage-secret
        key: CNPG_S3_SECRET_ACCESS_KEY
