# https://github.com/dragonflydb/dragonfly
---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-shared
spec:
  labels:
    dragonflydb.io/cluster: dragonfly-shared
  image: ghcr.io/dragonflydb/dragonfly:v2.0.0
  # replicas=2 creates 1 primary and 1 replica Dragonfly instance
  replicas: 2
  args:
    - --proactor_threads=1
    - --cluster_mode=emulated
    - --lock_on_hashtags
  resources:
    requests:
      cpu: 250m
      memory: 32Mi
    limits:
      # Automatic maxmemory uses ~307Mi, above the 256Mi minimum for one thread.
      # Leave ~77Mi for process and replication overhead.
      memory: 384Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "DoNotSchedule"
      labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: dragonfly
