# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mc-router
  namespace: &namespace minecraft
spec:
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  install:
    timeout: 2m
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    serviceAccount:
      mc-router:
        enabled: true
    controllers:
      mc-router:
        replicas: 1
        # Stop the old router before starting another autoscaling instance.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/itzg/mc-router
              tag: 1.42.0
            env:
              TZ: ${CLUSTER_TZ}
              APP_SERVICE_PORT: &containerPort 25565
              # GET /routes reads local routing state without waking backends.
              API_BINDING: ":8080"
              IN_KUBE_CLUSTER: "true"
              AUTO_SCALE_UP: "true"
              AUTO_SCALE_DOWN: "true"
              AUTO_SCALE_DOWN_AFTER: 15m
              KUBE_NAMESPACE: *namespace
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &healthCheck
                    path: /routes
                    port: 8080
                    httpHeaders:
                      - name: Accept
                        value: application/json
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 12
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *healthCheck
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *healthCheck
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
            resources:
              requests:
                memory: 64M
                cpu: 250m
              limits:
                memory: 256M
    service:
      minecraft:
        controller: *app
        type: LoadBalancer
        # Route to the always-running proxy from any L2 announcer; game servers
        # remain on-demand. Restore Local once Cilium includes this L2 fix:
        # https://github.com/cilium/cilium/pull/46399 (not in 1.18.13).
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: "192.168.1.85"
          external-dns.alpha.kubernetes.io/hostname: "mc-router.${SECRET_DOMAIN_INT},mc-deadly.${SECRET_DOMAIN_INT},mc-friendly.${SECRET_DOMAIN_INT}"
        ports:
          minecraft:
            port: *containerPort
            targetPort: *containerPort
            protocol: TCP
      api:
        controller: *app
        type: ClusterIP
        ports:
          api:
            port: &apiPort 8080
            protocol: TCP
            targetPort: 8080
    networkpolicies:
      api-isolation:
        controller: *app
        policyTypes:
          - Ingress
        # Keep game traffic open; do not allow other pods to access the routing API.
        # Kubernetes exempts this pod's local node, so kubelet HTTP probes still work.
        # Egress remains unrestricted for DNS, Kubernetes discovery, and backends.
        rules:
          ingress:
            - ports:
                - protocol: TCP
                  port: *containerPort
    defaultPodOptions:
      # mc-router discovers services and scales Minecraft StatefulSets.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
