# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: mc-common-cm
data:
  # Vane 1.18.0 targets Minecraft 1.21.5; upgrade the server and all Vane modules together.
  VERSION: "1.21.5"
  # older versions are in the experimental channel
  PAPER_CHANNEL: experimental
  # ProtocolLib 5.4.0 supports 1.21.4-1.21.8 and is required by Vane 1.18.0.
  # Keep ViaVersion and ViaBackwards on matching releases.
  # BlueMap 5.11+ needs a stored map-config migration; handle separately from startup fixes.
  # EssentialsX 2.21.1 explicitly supports 1.21.5; newer releases target newer MC patches.

  # SPIGET_RESOURCES
  # 84365 BlueMap-Essentials
  SPIGET_RESOURCES: |
    84365
  PLUGINS: |
    https://github.com/dmulloy2/ProtocolLib/releases/download/5.4.0/ProtocolLib.jar
    https://github.com/oddlama/vane/releases/download/v1.18.0/vane-core-1.18.0.jar
    https://github.com/oddlama/vane/releases/download/v1.18.0/vane-trifles-1.18.0.jar
    https://github.com/oddlama/vane/releases/download/v1.18.0/vane-admin-1.18.0.jar
    https://github.com/oddlama/vane/releases/download/v1.18.0/vane-enchantments-1.18.0.jar
    https://github.com/oddlama/vane/releases/download/v1.18.0/vane-portals-1.18.0.jar
    https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.11.0/PAPER/ViaVersion-5.11.0.jar
    https://hangarcdn.papermc.io/plugins/ViaVersion/ViaBackwards/versions/5.11.0/PAPER/ViaBackwards-5.11.0.jar
    https://download.luckperms.net/1668/bukkit/loader/LuckPerms-Bukkit-5.5.81.jar
    https://hangarcdn.papermc.io/plugins/jmp/TabTPS/versions/1.3.28/PAPER/tabtps-spigot-1.3.28.jar
    https://github.com/EssentialsX/Essentials/releases/download/2.21.1/EssentialsX-2.21.1.jar
    https://github.com/MC-Machinations/PaperTweaks/releases/download/v0.5.0/PaperTweaks.jar
    https://github.com/BlueMap-Minecraft/BlueMap/releases/download/v5.9/bluemap-5.9-spigot.jar
