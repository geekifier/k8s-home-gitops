# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mc-friendly
spec:
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      mc-friendly:
        # yaml-language-server: $schema=https://raw.githubusercontent.com/itzg/minecraft-server-charts/refs/heads/master/charts/minecraft/values.schema.json
        type: statefulset
        # mc-router scales between 0 and 1; keep Helm from resetting it.
        replicas: null
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.10.1@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
            env:
              TZ: ${CLUSTER_TZ}
              APP_SERVICE_PORT: &containerPort 25565
              EULA: "true"
              TYPE: "PAPER"
              LEVEL: "friendly"
              DIFFICULTY: "easy"
              MAX_PLAYERS: 10
              MODE: "creative"
              MEMORY: 2048M
              ALLOW_FLIGHT: "true"
              STOP_SERVER_ANNOUNCE_DELAY: 30
              STOP_DURATION: 60
            envFrom:
              - secretRef:
                  name: mc-friendly-secret
              - configMapRef:
                  name: mc-common-cm
            probes:
              # Ready only once Minecraft answers status pings; mc-router routes on readyReplicas.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &mcHealth
                      - mc-health
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *mcHealth
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *mcHealth
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 10
            resources:
              requests:
                memory: 2Gi
                cpu: 1
              limits:
                memory: 3Gi
    route:
      app:
        labels:
          auth.xenu.internal/method: none
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - "mc-friendly-map.${SECRET_DOMAIN_INT}"
        rules:
          - backendRefs:
              - identifier: map
                port: http
    service:
      app:
        controller: *app
        forceRename: *app
        type: ClusterIP
        annotations:
          "mc-router.itzg.me/externalServerName": "mc-friendly.${SECRET_DOMAIN_INT}"
        ports:
          minecraft:
            port: *containerPort
      map:
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: 8100
            targetPort: 8100
            protocol: TCP

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        enabled: true
        existingClaim: mc-friendly-pvc
        type: persistentVolumeClaim
      config:
        type: configMap
        name: mc-common-config-cm
        globalMounts:
          - path: /data/plugins/BlueMap/core.conf
            subPath: bluemap_core.conf
