# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mc-deadly
spec:
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: app-template-v5
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      mc-deadly:
        # yaml-language-server: $schema=https://raw.githubusercontent.com/itzg/minecraft-server-charts/refs/heads/master/charts/minecraft/values.schema.json
        type: statefulset
        # mc-router scales between 0 and 1; keep Helm from resetting it.
        replicas: null
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.11.0@sha256:8d5080d8dcd0a2629c2e4f248678373a337a40537ad6ef2857c7dbcda6e3eadd
            env:
              TZ: ${CLUSTER_TZ}
              APP_SERVICE_PORT: &containerPort 25565
              EULA: "true"
              TYPE: "PAPER"
              LEVEL: "deadly"
              DIFFICULTY: "easy"
              MAX_PLAYERS: 10
              MODE: "survival"
              MEMORY: 2048M
              STOP_SERVER_ANNOUNCE_DELAY: 30
              STOP_DURATION: 60
            envFrom:
              - secretRef:
                  name: mc-deadly-secret
              - configMapRef:
                  name: mc-common-cm
            probes:
              # Ready only once Minecraft answers status pings; mc-router routes on readyReplicas.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &mcHealth
                      - mc-health
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *mcHealth
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *mcHealth
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 10
            resources:
              requests:
                memory: 2Gi
                cpu: 1
              limits:
                memory: 3Gi
    service:
      app:
        controller: *app
        type: ClusterIP
        annotations:
          "mc-router.itzg.me/externalServerName": "mc-deadly.${SECRET_DOMAIN_INT}"
        ports:
          minecraft:
            port: *containerPort
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        enabled: true
        existingClaim: mc-deadly-pvc
        type: persistentVolumeClaim
      config:
        type: configMap
        name: mc-common-config-cm
        globalMounts:
          - path: /data/plugins/BlueMap/core.conf
            subPath: bluemap_core.conf
