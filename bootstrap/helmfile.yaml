---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  # waitRetries: 3 # Not supported by Helm yet

# Resolve chart coordinates and values from the application's Flux manifests.
bases:
  - ./defaults.yaml
  - ./templates/repositories.yaml.gotmpl

releases:
  - name: cilium
    namespace: kube-system
    atomic: true
    inherit:
      - template: default

  - name: coredns
    namespace: kube-system
    atomic: true
    inherit:
      - template: default
    needs: ['kube-system/cilium']

  - name: spegel
    namespace: kube-system
    atomic: true
    inherit:
      - template: default
    needs: ['kube-system/coredns']

  - name: cert-manager
    namespace: cert-manager
    atomic: true
    inherit:
      - template: default
    needs: ['kube-system/spegel']

  - name: flux-operator
    namespace: flux-system
    atomic: true
    inherit:
      - template: default
    needs: ['cert-manager/cert-manager']

  - name: flux-instance
    namespace: flux-system
    atomic: true
    inherit:
      - template: default
    needs: ['flux-system/flux-operator']
