---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: "{{.ROOT_DIR}}/bootstrap"
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes"
  SCRIPTS_DIR: "{{.ROOT_DIR}}/scripts"
  TALOS_DIR: "{{.ROOT_DIR}}/talos"
  PRIVATE_DIR: "{{.ROOT_DIR}}/.private"
  TALOSCONFIG: "{{.ROOT_DIR}}/talos/clusterconfig/talosconfig"

env:
  KUBECONFIG: "{{.ROOT_DIR}}/kubeconfig"
  SOPS_AGE_KEY_FILE: "{{.ROOT_DIR}}/age.key"
  TALOSCONFIG: "{{.TALOSCONFIG}}"

includes:
  bootstrap: .taskfiles/bootstrap
  talos: .taskfiles/talos

tasks:
  default: task --list

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux

  test:
    desc: Use flux-local to validate the workdir configuration
    cmd: flux-local test --enable-helm --all-namespaces --path kubernetes/flux/cluster -v
    preconditions:
      - which flux-local

  build-all:
    desc: Use flux-local to build all KS and HR resources
    cmd: flux-local build all ./kubernetes --enable-helm --skip-secrets
    preconditions:
      - which flux-local

  chart-drift:
    desc: Diff a HelmRelease's inlined values against every chart version it ever pinned
    summary: |
      Finds upstream defaults that changed underneath an inlined values override.

      When a HelmRelease inlines a chart's full values file, Renovate bumps only the
      version string, so an upstream default that moved is silently kept at the old
      value with no diff to review. That is how KubeSchedulerDown fired for 33 days
      (PR #776): the chart moved control-plane Services to app.kubernetes.io/component
      but the pinned `jobLabel: jobLabel` override survived the bump.

      Comparing more than two versions is what separates drift from intent. A value
      still matching some older chart default was never a decision; one differing from
      every version ever pinned here is a real customization.

      Usage: task chart-drift -- <helmrelease.yaml> [--from VER]... [--to VER]

      Baselines default to every version this file's git history ever pinned -- all of
      them, no cap -- so drift missed during one upgrade stays visible; target defaults
      to the version pinned in the file.

      Audit what a Renovate bump would silently change, before merging it:
        task chart-drift -- <helmrelease.yaml> --to 0.90.0

      Values print as 120-character stubs, which hides which keys of a nested override
      were actually overridden. Add --expand to print each finding in full, as a
      unified diff against the chart default (- chart, + repo).

      Exit 1 on stale drift or a value whose shape conflicts with the chart. Exit 3
      means nothing was found but a baseline was capped or unfetchable, so coverage was
      incomplete -- that is not a clean result.
    cmd: "{{.SCRIPTS_DIR}}/chart-values-drift.sh {{.CLI_ARGS}}"
    preconditions:
      - sh: test -n '{{.CLI_ARGS}}'
        msg: "Usage: task chart-drift -- <helmrelease.yaml> [--from VER]... [--to VER]"
      - which helm
      - which yq
      - which python3

  dashboard-prep:
    desc: Prepares Grafana dashboard JSON files for use in ConfigMaps
    summary: |
      Escape vars in Grafana dashboard JSON and build a YAML list for processing by ConfigMapGenerator.
      Usage: task dashboard-prep -- path/to/dashboard/directory
      Example: task dashboard-prep -- kubernetes/apps/observability/grafana-dashboards/dashboards/
      The dir you specify should be the dir containing the kustomization file (assuming it's in the same or parent dir).
    preconditions:
      - sh: test -d '{{.JSON_PATH }}'
        msg: "Directory {{ .JSON_PATH }} does not exist"
      - sh: '[ "{{ OS }}" != "darwin" ] || command -v gsed'
        msg: gsed is required when running on macOS
    vars:
      JSON_PATH: '{{.CLI_ARGS | default "./kubernetes/apps/default/teslamate/app/dashboards"}}'
    cmds:
      - for: { var: JSON_PATH }
        cmd: |
          [[ "{{ OS }}" == "darwin" ]] && SEDCMD="gsed" || SEDCMD="sed"
          echo "Running in dir: {{ .ITEM }}"
          echo "files:"
          for f in $(find {{ .ITEM }} -type f -name '*.json' | sort); do
            "$SEDCMD" -i -r \
              '/\$\{[^\}]+\}/ s/([^$])\$\{([^}]+)\}/\1\$\${\2}/g' \
              "$f"
            # Get the path structure by analyzing the filename
            FULL_PATH="${f}"
            BASE_PATH="{{ .ITEM }}"

            # Remove the base path from the full path
            REL_PATH="${FULL_PATH#$BASE_PATH}"
            # Remove leading slash if present
            REL_PATH="${REL_PATH#/}"

            echo -e "- name: grafana-dashboard-$(basename "$f" .json)"
            echo -e "  files:\n    - ./$REL_PATH"
          done
  local-diff-hr:
    desc: Use flux-local to diff HelmRelease resources
    cmd: |
      flux-local diff hr --path ./kubernetes/flux/cluster --branch-orig origin/head \
      --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart,checksum/secret" \
      --skip-kinds "ValidatingWebhookConfiguration,MutatingWebhookConfiguration" --all-namespaces | moor -lang=yaml
    preconditions:
      - which flux-local
      - which moor
  local-diff-ks:
    desc: Use flux-local to diff Kustomization resources
    cmd: |
      flux-local diff ks --all-namespaces --path kubernetes/flux/cluster --no-skip-secrets --limit-bytes 4096 | moor -lang=diff
    preconditions:
      - which flux-local
      - which moor
