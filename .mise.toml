[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
TOPFCONFIG = "{{config_root}}/talos/topf.yaml"
BOOTSTRAP_DIR = "{{config_root}}/bootstrap"
KUBERNETES_DIR = "{{config_root}}/kubernetes"
ROOT_DIR = "{{config_root}}"
SCRIPTS_DIR = "{{config_root}}/scripts"
TALOS_DIR = "{{config_root}}/talos"

[tools]
dprint = "0.60.1"
"aqua:evilmartians/lefthook" = "2.1.16"
python = "3.14.8"
"pipx:makejinja" = "2.9.1"
"github:home-operations/flate" = "0.6.5"
uv = "latest"
k9s = "latest"
helm-diff = "latest"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cli/cli" = "2.102.0"
"aqua:cloudflare/cloudflared" = "2026.9.3"
# Manage CNPG directly with mise. Krew remains Homebrew-managed for other plugins.
"aqua:cloudnative-pg/cloudnative-pg/kubectl-cnpg" = "1.30.1"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.2"
# Renovate: the Flux release bundled in the FluxInstance artifact, mirrored here.
# oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.61.0
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.54.0"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.8.1"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
# Managed with the topf and tuppr Kubernetes targets by Renovate.
kubectl = "1.36.5"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:yannh/kubeconform" = "0.8.0"
"github:postfinance/topf" = "v0.6.1"
"go:github.com/VictoriaMetrics-Community/mcp-victoriametrics/cmd/mcp-victoriametrics" = { version = "latest" }
"go:github.com/backube/volsync/kubectl-volsync" = { version = "latest" }
talosctl = "1.13.10"
