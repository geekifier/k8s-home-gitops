---
# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
min_version: "2.1.12"
glob_matcher: doublestar

pre-commit:
  commands:
    dprint:
      glob: "**/*.{yaml,yml,json,jsonc,md,markdown}"
      run: mise exec -- dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    context-budget:
      run: scripts/check-context-budget.sh --warn
    sops-encrypted:
      glob: "**/?*.sops.{yaml,yml}"
      run: mise exec -- scripts/check-sops-encrypted.sh {staged_files}
    cosign-identity:
      glob: "{kubernetes,bootstrap}/**/*.{yaml,yml}"
      run: mise exec -- scripts/check-cosign-identity.sh {staged_files}
