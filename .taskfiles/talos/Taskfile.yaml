---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Day-2 apply/upgrade tasks rely on topf's built-in diff-and-confirm prompt;
# only the destructive reset task disables it in favour of Task's own prompt.

tasks:
  render:
    desc: Render Talos machine configs to talos/rendered/
    dir: "{{.TALOS_DIR}}"
    cmd: topf render --output ./rendered
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  talosconfig:
    desc: (Re)generate talos/talosconfig from the secrets bundle (1y admin cert)
    dir: "{{.TALOS_DIR}}"
    cmd: topf talosconfig > talosconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  diff:
    desc: Show pending Talos config changes without applying them (exit 2 = changes pending)
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --dry-run
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOSCONFIG}}
      - which topf

  nodes:
    desc: List all nodes and their current state
    dir: "{{.TALOS_DIR}}"
    cmd: topf nodes
    preconditions:
      - which topf

  apply:
    desc: Apply Talos config to all nodes, one at a time (shows a diff and asks first) [MODE=auto]
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --mode {{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOSCONFIG}}
      - which topf

  apply-node:
    desc: Apply Talos config to a node (shows a diff and asks first) [NODE=required, MODE=auto]
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --nodes-filter '^{{.NODE}}$' --mode {{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOSCONFIG}}
      - which topf

  upgrade:
    desc: Upgrade Talos on all nodes, one at a time (asks first)
    dir: "{{.TALOS_DIR}}"
    cmd: topf upgrade
    preconditions:
      - test -f {{.TALOSCONFIG}}
      - which topf

  upgrade-node:
    desc: Upgrade Talos on a single node (asks first) [NODE=required]
    dir: "{{.TALOS_DIR}}"
    cmd: topf upgrade --nodes-filter '^{{.NODE}}$'
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOSCONFIG}}
      - which topf

  # topf intentionally does not manage Kubernetes upgrades
  upgrade-k8s:
    desc: Upgrade Kubernetes to the version in topf.yaml
    dir: "{{.TALOS_DIR}}"
    cmd: talosctl --nodes {{.CONTROLPLANE_IP}} upgrade-k8s --to {{.KUBERNETES_VERSION}}
    vars:
      CONTROLPLANE_IP:
        sh: yq '[.nodes[] | select(.role == "control-plane")][0].ip' {{.TALOS_DIR}}/topf.yaml
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: "{{.TALOS_DIR}}"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --confirm=false {{if eq .CLI_FORCE true}}--full{{end}}
    preconditions:
      - which topf
